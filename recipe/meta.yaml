{% set name = "pyift" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyift-{{ version }}.tar.gz
  sha256: efc67ba6702de9c36bff48182ca4aa404f510389b43ff3e5a5c39d485a7c0428

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 2

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - pip
    - python
    - setuptools-scm
    - numpy
  run:
    - python
    - scipy

test:
  imports:
    - pyift
  commands:
    - pip list
    - pip check
  requires:
    - pip

about:
  home: https://github.com/pyift/pyift
  summary: Python Image Foresting Transform Library
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - goanpeca
    - JoOkuma
